name: Maquette offres Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - name: Base maquette finale
        uses: actions/checkout@v4
        with:
          repository: leslita06/yelema-site-finale
          ref: main
          path: site
      - name: Script maquette-offres
        uses: actions/checkout@v4
        with:
          repository: leslita06/yelema-site-finale
          ref: maquette-offres-261101
          path: script
      - name: Generer la maquette
        run: |
          rm -rf site/.git
          python3 script/maquette-offres/build_site.py site
          test -f site/offres-executif.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dep
        uses: actions/deploy-pages@v4
